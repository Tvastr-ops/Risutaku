name: Build & Release

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Modern ARM APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Setup Keystore from Secrets
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          cat <<EOF > android/keystore.properties
          releaseKeyStore=app/release.keystore
          releaseStorePassword=$STORE_PASSWORD
          releaseKeyPassword=$KEY_PASSWORD
          releaseKeyAlias=$KEY_ALIAS
          EOF

      - name: Build Modern ARM64 Release APK
        run: |
          flutter build apk --release --target-platform android-arm64

      - name: Prepare Artifacts
        run: |
          mkdir -p build/outputs/release
          APK_FILE=$(find build/app/outputs/flutter-apk -name "*.apk" -not -name "*unaligned*" | head -n 1)
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" build/outputs/release/Risutaku-arm64-v8a.apk

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Risutaku-arm64-v8a-apk
          path: build/outputs/release/Risutaku-arm64-v8a.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/outputs/release/Risutaku-arm64-v8a.apk
          generate_release_notes: true
          draft: false
          prerelease: false
