name: Build & Release

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Modern ARM APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Static Analysis
        run: flutter analyze

      - name: Build Modern ARM64 Release APK
        run: |
          flutter build apk --release --target-platform android-arm64

      - name: Prepare Artifacts
        run: |
          mkdir -p build/outputs/release
          cp build/app/outputs/flutter-apk/app-release.apk build/outputs/release/Risutaku-arm64-v8a.apk

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Risutaku-arm64-v8a-apk
          path: build/outputs/release/Risutaku-arm64-v8a.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/outputs/release/Risutaku-arm64-v8a.apk
          generate_release_notes: true
          draft: false
          prerelease: false
